<!doctype html>
<html lang="en" data-theme="mocha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harry@github: ~</title>
<meta name="description" content="Harry's interactive terminal — type help, play some music, jam on the piano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* restrained palette: mostly fg/dim, green prompt, blue paths, one highlight */
  :root, [data-theme=mocha] { --fg:#cdd6f4; --dim:#7f849c; --green:#a6e3a1; --blue:#89b4fa; --hl:#f9e2af; --red:#f38ba8; --term:#1e1e2e; --desk:#11111b; --line:rgba(255,255,255,.08); }
  [data-theme=matrix] { --fg:#b8ffc4; --dim:#4f8f5c; --green:#39ff14; --blue:#7dff9a; --hl:#d4ff6a; --red:#ff5f5f; --term:#030a05; --desk:#000; }
  [data-theme=amber]  { --fg:#ffd28a; --dim:#a07a3c; --green:#ffb000; --blue:#ffc65c; --hl:#ffe6a8; --red:#ff6b4a; --term:#0f0a02; --desk:#000; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:radial-gradient(ellipse at 50% 0%, #181825, var(--desk) 70%) fixed; color:var(--fg); font:15px/1.55 "JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden; }

  /* a real (macOS-style) terminal window */
  .win { position:relative; max-width:920px; height:calc(100dvh - 48px); margin:24px auto; display:flex; flex-direction:column; border-radius:10px; overflow:hidden;
    background:var(--term); border:1px solid #45475a; box-shadow:0 0 0 .5px #000, 0 22px 70px 4px rgba(0,0,0,.6);
    animation:boot .35s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes boot { from { opacity:0; transform:scale(.97); } }

  .bar { display:flex; align-items:center; gap:8px; padding:9px 12px; background:linear-gradient(#313244, #2a2b3d); border-bottom:1px solid #111; color:#a6adc8; font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .dot { width:12px; height:12px; border-radius:50%; } .r{background:#ff5f57} .y{background:#febc2e} .g{background:#28c840}
  .bar .t { flex:1; text-align:center; }
  .live { opacity:0; color:var(--green); transition:opacity .2s; font-size:12px; } .playing .live { opacity:1; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  #out { flex:1; overflow-y:auto; padding:14px 18px; white-space:pre-wrap; word-break:break-word; scrollbar-width:thin; scrollbar-color:#45475a transparent; }
  #out > div { animation:enter .15s ease-out both; }
  @keyframes enter { from { opacity:0; } }

  .line { display:flex; gap:8px; padding:4px 18px 12px; align-items:center; }
  #in { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--fg); font:inherit; caret-color:var(--green); }

  /* prompt + output classes (most collapse to plain text on purpose) */
  .u,.h,.acc,.ok { color:var(--green); } .p,.cy,a { color:var(--blue); } .s,.pk { color:var(--fg); } .pk { font-weight:600; }
  .d,.dim,.pu { color:var(--dim); } .warn { color:var(--hl); } .err { color:var(--red); }
  a { text-underline-offset:3px; }
  .banner { display:inline-block; color:var(--green); font-weight:600; font-size:min(15px, 3.2vw); line-height:1.15; }
  .sw { display:inline-block; width:22px; height:12px; vertical-align:middle; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 10px; }
  .chips button { cursor:pointer; min-height:34px; padding:4px 10px; border-radius:4px; font:inherit; font-size:12px; color:var(--dim);
    background:rgba(255,255,255,.03); border:1px solid var(--line); transition:transform .15s, border-color .15s, color .15s; }
  .chips button:hover { color:var(--fg); border-color:var(--dim); }
  .chips button:focus-visible { color:var(--fg); outline:2px solid var(--green); outline-offset:2px; }
  .chips button:active { transform:scale(.96); }
  @media (pointer:coarse) { .chips button { min-height:44px; } }

  /* tmux default status line: green bar, black text */
  .status { display:flex; align-items:center; gap:12px; padding:2px 10px; font-size:12px; background:var(--green); color:#000; }
  .status b { font-weight:700; }
  #np { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .spacer { flex:1; }
  #viz { width:96px; height:14px; }

  @media (max-width:640px) {
    body { font-size:13px; }
    .win { margin:0; height:100dvh; border-radius:0; border:0; }
    #out { padding:12px 16px; } .line, .chips { padding-left:16px; padding-right:16px; }
    #viz { width:56px; }
  }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main class="win" onclick="if(!getSelection().toString())inp.focus()">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="t">harry@github: ~ — zsh — 80×24</span><span class="live" aria-hidden="true">● live</span></div>
  <div id="out" role="log" aria-live="polite"></div>
  <div class="chips" aria-label="Quick commands"></div>
  <form class="line" onsubmit="event.preventDefault();run(inp.value)">
    <label for="in"><span class="u">harry</span><span class="d">@</span><span class="h">github</span><span class="d">:</span><span class="p">~</span><span class="s">$</span></label>
    <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus aria-label="Command">
  </form>
  <div class="status">
    <b>[harry-os]</b><span>0:zsh*</span><span id="np">♪ off</span>
    <span class="spacer"></span>
    <canvas id="viz" aria-hidden="true"></canvas>
    <span id="clock">--:--</span>
  </div>
</main>

<script>
const out = document.getElementById('out'), inp = document.getElementById('in'), root = document.documentElement;
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const print = (html='', cls='') => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; out.append(d); out.scrollTop = out.scrollHeight; };
const PS = '<span class="u">harry</span><span class="d">@</span><span class="h">github</span><span class="d">:</span><span class="p">~</span><span class="s">$</span>';

const files = {
  'about.txt': `Hi everyone, I'm <span class="pk">Harry</span> 🫶
<span class="pu">role    </span>  Graduate DevOps Engineer
<span class="pu">learning</span>  <span class="warn">Red Hat RHCSA (RHEL 10)</span> <span class="dim">— Sander Van Vugt course</span>
<span class="pu">hobbies </span>  🏂 snowboarding`,
  'stack.txt': `<span class="pu">devops  </span>  Linux  Docker  AWS  Git  CI/CD  Bash
<span class="pu">learning</span>  RHEL (RHCSA)  Red Hat OpenShift  ArgoCD <span class="warn">▓▓▓░░</span>
<span class="pu">web     </span>  React  Next.js  Node.js  Python  Django  TypeScript`,
  'contact.txt': `<span class="pu">LinkedIn</span>  <a href="https://linkedin.com/in/harry-chow" target="_blank" rel="noopener">linkedin.com/in/harry-chow</a>
<span class="pu">GitHub  </span>  <a href="https://github.com/harrycpc" target="_blank" rel="noopener">github.com/harrycpc</a>
Feel free to reach out, and let's connect! ✌️`,
};

const THEMES = ['mocha', 'matrix', 'amber'];
function setTheme(t) {
  root.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch {}
}

const cmds = {
  help: () => `<span class="acc">available commands</span>
  <span class="cy">whoami</span>      who is this          <span class="cy">ls</span> / <span class="cy">cat</span> &lt;file&gt;  browse files
  <span class="cy">stack</span>       tech stack           <span class="cy">contact</span>         get in touch
  <span class="pk">play</span>        start the music      <span class="pk">stop</span>            stop it
  <span class="pk">piano</span>       play with your keys  <span class="pu">theme</span> [name]    ${THEMES.join(' / ')}
  <span class="warn">neofetch</span>    system info          <span class="warn">snowboard</span>       🏂
  history / clear
<span class="dim">tip: ↑/↓ history · Tab autocomplete · Ctrl+L clear</span>`,
  whoami: () => files['about.txt'],
  ls: () => Object.keys(files).map(f => `<span class="cy">${f}</span>`).join('  '),
  cat: a => a ? (files[a] ?? `<span class="err">cat: ${esc(a)}: No such file or directory</span>`) : '<span class="err">usage: cat &lt;file&gt;</span>',
  stack: () => files['stack.txt'],
  contact: () => files['contact.txt'],
  theme: a => {
    const t = a ? a.toLowerCase() : THEMES[(THEMES.indexOf(root.dataset.theme) + 1) % THEMES.length];
    if (!THEMES.includes(t)) return `<span class="err">theme: unknown "${esc(a)}"</span> — try ${THEMES.join(', ')}`;
    setTheme(t); return `🎨 theme → <span class="pk">${t}</span>`;
  },
  neofetch: () => `<span class="acc">   .--.     </span> <span class="u">harry</span>@<span class="h">github</span>
<span class="acc">  |o_o |    </span> <span class="dim">────────────</span>
<span class="acc">  |:_/ |    </span> <span class="pu">OS</span>      harry-os on RHEL 10 (in training)
<span class="acc"> //   \\ \\   </span> <span class="pu">Shell</span>   zsh
<span class="acc">(|     | )  </span> <span class="pu">Theme</span>   ${root.dataset.theme}
<span class="acc">/'\\_   _/\`\\ </span> <span class="pu">Uptime</span>  ${Math.floor(performance.now() / 1000)}s
<span class="acc">\\___)=(___/ </span> <span class="pu">Music</span>   ${timer ? 'playing ♪' : 'off'}
             ${['--red','--green','--hl','--blue','--dim','--fg'].map(v => `<span class="sw" style="background:var(${v})"></span>`).join('')}`,
  snowboard: () => `<span class="cy">        __o
      _ \\<_      </span><span class="pk">shred mode: ON</span><span class="cy">
_____(_)/(_)_____________ 🏔
          \\\\
            \\\\    </span><span class="dim">~ fresh powder ~</span>`,
  history: () => hist.map((h, i) => `<span class="dim">${String(i + 1).padStart(4)}</span>  ${esc(h)}`).join('\n'),
  clear: () => { out.innerHTML = ''; },
  play: () => (startMusic(), '♪ now playing <span class="pk">harry.fm</span> — <span class="cy">snow day loop</span> <span class="dim">(stop to end)</span>'),
  stop: () => (stopMusic(), '♪ stopped'),
  piano: () => (piano = true, `🎹 piano mode — <span class="acc">a s d f g h j k</span> = C D E F G A B C · <span class="acc">w e t y u</span> = sharps · <span class="warn">Esc</span> to exit`),
  sudo: () => '<span class="err">harry is not in the sudoers file. This incident will be reported.</span> <span class="dim">(still studying for RHCSA 😉)</span>',
  echo: a => esc(a),
  date: () => new Date().toString(),
  exit: () => 'there is no escape. try <span class="acc">help</span>',
};
cmds.music = cmds.play; cmds.about = cmds.whoami;

const hist = []; let hi = 0;
function run(line) {
  line = line.trim(); inp.value = '';
  print(`${PS} ${esc(line)}`);
  if (!line) return;
  hist.push(line); hi = hist.length;
  const [c, ...rest] = line.split(/\s+/), arg = rest.join(' '), k = c.toLowerCase();
  if (k in cmds) { const r = cmds[k](arg); if (r) print(r); }
  else print(`<span class="err">zsh: command not found: ${esc(c)}</span> — try <span class="acc">help</span>`);
}

const chips = document.querySelector('.chips');
['help','whoami','stack','contact','play','stop','piano','theme','clear'].forEach(c => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = c;
  b.onclick = e => { e.stopPropagation(); run(c); inp.focus(); }; chips.append(b);
});

// ---------- music: Web Audio synth, no files needed ----------
let ac, master, analyser, noise, timer, step = 0, nextT = 0, piano = false;
const mtof = m => 440 * 2 ** ((m - 69) / 12);
const prog = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const BPM = 96, STEP = 60 / BPM / 4;
function audio() {
  if (!ac) {
    ac = new AudioContext(); master = ac.createGain(); master.gain.value = .55;
    analyser = ac.createAnalyser(); analyser.fftSize = 64; analyser.smoothingTimeConstant = .75;
    master.connect(analyser).connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * .2, ac.sampleRate);
    noise.getChannelData(0).forEach((_, i, d) => d[i] = Math.random() * 2 - 1);
  }
  ac.resume(); return ac;
}
function tone(f, t, d, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .02);
}
function kick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
  g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.0001, t + .3);
  o.connect(g).connect(master); o.start(t); o.stop(t + .32);
}
function hiss(t, vol, freq, dur) { // hats & snare from one noise buffer
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise; f.type = freq > 5000 ? 'highpass' : 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t + dur);
}
function schedule() {
  while (nextT < ac.currentTime + .12) {
    const bar = step >> 4, ch = prog[bar % 4], i = step % 16;
    tone(mtof(ch[[0,1,2,1][i % 4]] + 12), nextT, .25, 'triangle', .11);              // arpeggio
    if (i % 8 === 0) tone(mtof(ch[0] - 12), nextT, STEP * 7, 'sine', .3);             // bass
    if (bar >= 2) {                                                                   // drums kick in on bar 3
      if (i % 4 === 0) kick(nextT);
      if (i % 8 === 4) hiss(nextT, .18, 1800, .16);
    }
    if (i % 2 === 0) hiss(nextT, i % 4 ? .035 : .06, 7000, .05);
    if (bar % 8 >= 4 && i % 4 === 0) tone(mtof(ch[(i / 4) % 3] + 24), nextT, .5, 'square', .03); // lead on 2nd half
    nextT += STEP; step++;
  }
  timer = setTimeout(schedule, 25);
}
const np = document.getElementById('np');
function startMusic() { if (timer) return; audio(); nextT = ac.currentTime + .05; step = 0; schedule(); root.classList.add('playing'); np.textContent = '♪ harry.fm · snow day loop'; }
function stopMusic() { clearTimeout(timer); timer = null; root.classList.remove('playing'); np.textContent = '♪ off'; }

// ---------- visualizer ----------
const cv = document.getElementById('viz'), cx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
function draw() {
  const w = cv.width = cv.clientWidth * dpr, h = cv.height = cv.clientHeight * dpr;
  let d = new Uint8Array(16);
  if (analyser) { const f = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(f); d = f.slice(0, 16); }
  if (w) { cx.fillStyle = '#000'; const bw = w / 16; d.forEach((v, i) => { const bh = Math.max(dpr, v / 255 * h); cx.fillRect(i * bw, h - bh, bw - dpr, bh); }); }
  requestAnimationFrame(draw);
}
const clock = document.getElementById('clock');
const tick = () => clock.textContent = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

// ---------- input: history, tab-complete, piano ----------
const keymap = { a:60, w:61, s:62, e:63, d:64, f:65, t:66, g:67, y:68, h:69, u:70, j:71, k:72 };
const NOTE = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
inp.addEventListener('keydown', e => {
  if (piano) {
    if (e.key === 'Escape') { piano = false; print('🎹 piano mode off'); np.textContent = timer ? '♪ harry.fm · snow day loop' : '♪ off'; }
    else if (keymap[e.key] && !e.repeat) { audio(); tone(mtof(keymap[e.key]), ac.currentTime, 1.2, 'triangle', .4); np.textContent = `🎹 ${NOTE[keymap[e.key] % 12]}${Math.floor(keymap[e.key] / 12) - 1}`; }
    e.preventDefault(); return;
  }
  if (e.key === 'ArrowUp' && hi > 0) { inp.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { inp.value = hist[++hi] ?? ''; hi = Math.min(hi, hist.length); e.preventDefault(); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const [c, a] = inp.value.split(/\s+/);
    const pool = a !== undefined
      ? (c === 'theme' ? THEMES : Object.keys(files)).filter(f => f.startsWith(a)).map(f => `${c} ${f}`)
      : Object.keys(cmds).filter(k => k.startsWith(c));
    if (pool.length === 1) inp.value = pool[0] + (a === undefined ? ' ' : '');
    else if (pool.length) print(pool.join('  '), 'dim');
  } else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); cmds.clear(); }
});

// ---------- boot ----------
let saved; try { saved = localStorage.getItem('theme'); } catch {}
setTheme(THEMES.includes(saved) ? saved : 'mocha');
tick(); setInterval(tick, 10000); draw();
const fast = matchMedia('(prefers-reduced-motion:reduce)').matches;
[`<span class="dim">harry-os v2.0 · ${new Date().toDateString()} · ttys001</span>`,
 `<span class="ok">[ ok ]</span> mounting <span class="cy">/home/harry</span>`,
 `<span class="ok">[ ok ]</span> warming up <span class="pk">synth engine</span>`,
 `<span class="ok">[ ok ]</span> tuning <span class="pu">piano</span>`,
 `<span class="banner">
 _
| |__   __ _ _ __ _ __ _   _  ___ _ __   ___
| '_ \\ / _\` | '__| '__| | | |/ __| '_ \\ / __|
| | | | (_| | |  | |  | |_| | (__| |_) | (__
|_| |_|\\__,_|_|  |_|   \\__, |\\___| .__/ \\___|
                       |___/     |_|         </span>`,
 `Welcome! Type <span class="acc">help</span> to look around, <span class="pk">play</span> for music 🎶, or <span class="acc">theme</span> to switch colours.`,
].forEach((l, i) => setTimeout(() => print(l), fast ? 0 : 200 + i * 160));
</script>
</body>
</html>
