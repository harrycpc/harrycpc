<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harry@github: ~</title>
<style>
  :root { --bg:#0b0f0c; --panel:#111712; --fg:#c8f7c5; --dim:#6f8f6c; --accent:#7CFC9a; --warn:#ffcf6e; --err:#ff7a7a; --link:#7fd3ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .win { max-width:900px; height:calc(100% - 32px); margin:16px auto; display:flex; flex-direction:column; background:var(--panel); border:1px solid #1f2b20; border-radius:10px; box-shadow:0 0 40px #7cfc9a14; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#0e130f; border-bottom:1px solid #1f2b20; color:var(--dim); font-size:13px; }
  .dot { width:12px; height:12px; border-radius:50%; } .r{background:#ff5f57} .y{background:#febc2e} .g{background:#28c840}
  .bar .t { flex:1; text-align:center; }
  #out { flex:1; overflow-y:auto; padding:12px 16px; white-space:pre-wrap; word-break:break-word; }
  #out::after { content:""; display:block; height:4px; }
  .line { display:flex; gap:8px; padding:0 16px 12px; align-items:center; }
  .ps { color:var(--accent); white-space:nowrap; } .ps b { color:var(--link); font-weight:normal; }
  #in { flex:1; min-width:0; background:none; border:0; outline:0; color:var(--fg); font:inherit; caret-color:var(--accent); }
  .dim{color:var(--dim)} .acc{color:var(--accent)} .warn{color:var(--warn)} .err{color:var(--err)}
  a { color:var(--link); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 10px; }
  .chips button { background:#16201a; color:var(--fg); border:1px solid #24342a; border-radius:4px; font:inherit; font-size:12px; padding:4px 8px; cursor:pointer; }
  .chips button:hover, .chips button:focus-visible { border-color:var(--accent); outline:none; }
  .status { display:flex; justify-content:space-between; gap:8px; padding:4px 12px; background:#0e130f; border-top:1px solid #1f2b20; color:var(--dim); font-size:12px; }
  #viz { color:var(--accent); letter-spacing:1px; }
  @media (max-width:600px){ html,body{font-size:13px} .win{margin:0; height:100%; border-radius:0} }
  @media (prefers-reduced-motion:reduce){ * { animation:none!important } }
</style>
</head>
<body>
<div class="win" onclick="if(!getSelection().toString())inp.focus()">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="t">harry@github: ~ — zsh</span></div>
  <div id="out" role="log" aria-live="polite"></div>
  <div class="chips" aria-label="Quick commands"></div>
  <form class="line" onsubmit="event.preventDefault();run(inp.value)">
    <label class="ps" for="in">harry@github:<b>~</b>$</label>
    <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
  </form>
  <div class="status"><span id="np">♪ stopped — type <span class="acc">play</span></span><span id="viz" aria-hidden="true"></span></div>
</div>
<script>
const out = document.getElementById('out'), inp = document.getElementById('in');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const print = (html='', cls='') => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; out.append(d); out.scrollTop = out.scrollHeight; };

const files = {
  'about.txt': `Hi everyone, I'm <span class="acc">Harry</span> 🫶
💻 Currently taking the <span class="warn">Red Hat RHCSA RHEL 10</span> video course by Sander Van Vugt
🏂 I like snowboarding very much!
🎹 Sometimes I play piano`,
  'stack.txt': `<span class="dim">langs   </span> JavaScript TypeScript Python HTML5 CSS3 SASS GraphQL LaTeX
<span class="dim">frontend</span> React React-Native Next.js Svelte Redux MUI Bootstrap Three.js Storybook
<span class="dim">backend </span> Node.js Express Django Postgres
<span class="dim">tooling </span> Vite Webpack npm ESLint Git Docker CircleCI AWS
<span class="dim">work    </span> Figma Jira Confluence Notion Trello Postman`,
  'contact.txt': `LinkedIn  <a href="https://linkedin.com/in/harry-chow" target="_blank" rel="noopener">linkedin.com/in/harry-chow</a>
GitHub    <a href="https://github.com/harrycpc" target="_blank" rel="noopener">github.com/harrycpc</a>
Feel free to reach out, and let's connect! ✌️`,
};

const cmds = {
  help: () => `<span class="acc">available commands</span>
  whoami      who is this
  ls          list files          cat &lt;file&gt;   read a file
  stack       tech stack          contact      get in touch
  neofetch    system info         snowboard    🏂
  play / stop music on/off        piano        play piano with your keyboard
  history     past commands       clear        clear screen
<span class="dim">tip: ↑/↓ history, Tab to autocomplete</span>`,
  whoami: () => files['about.txt'],
  ls: () => Object.keys(files).map(f => `<span class="acc">${f}</span>`).join('  '),
  cat: a => a ? (files[a] ?? `<span class="err">cat: ${esc(a)}: No such file or directory</span>`) : '<span class="err">usage: cat &lt;file&gt;</span>',
  stack: () => files['stack.txt'],
  contact: () => files['contact.txt'],
  neofetch: () => `<span class="acc">   .--.     </span> <span class="acc">harry</span>@<span class="acc">github</span>
<span class="acc">  |o_o |    </span> ------------
<span class="acc">  |:_/ |    </span> <span class="warn">OS</span>      RHEL 10 (in training)
<span class="acc"> //   \\ \\   </span> <span class="warn">Shell</span>   zsh
<span class="acc">(|     | )  </span> <span class="warn">Hobbies</span> snowboarding, piano
<span class="acc">/'\\_   _/\`\\ </span> <span class="warn">Uptime</span>  ${Math.floor(performance.now()/1000)}s
<span class="acc">\\___)=(___/ </span> <span class="warn">Music</span>   ${ac && ac.state === 'running' && timer ? 'playing ♪' : 'off'}`,
  snowboard: () => `<span class="acc">        __o
      _ \\<_      shred mode: ON
_____(_)/(_)_____________ 🏔
          \\\\
            \\\\    ~ fresh powder ~</span>`,
  history: () => hist.map((h, i) => `${String(i+1).padStart(4)}  ${esc(h)}`).join('\n'),
  clear: () => { out.innerHTML = ''; },
  play: () => (startMusic(), '♪ now playing <span class="acc">harry.fm — snow day loop</span> <span class="dim">(stop to end)</span>'),
  stop: () => (stopMusic(), '♪ stopped'),
  piano: () => (piano = true, `🎹 piano mode — keys <span class="acc">a s d f g h j k</span> = C D E F G A B C, <span class="acc">w e t y u</span> = sharps. <span class="warn">Esc</span> to exit.`),
  sudo: () => '<span class="err">harry is not in the sudoers file. This incident will be reported.</span> <span class="dim">(still studying for RHCSA 😉)</span>',
  echo: a => esc(a),
  date: () => new Date().toString(),
  exit: () => 'there is no escape. try <span class="acc">help</span>',
};
cmds.music = cmds.play; cmds.about = cmds.whoami;

const hist = []; let hi = 0;
function run(line) {
  line = line.trim(); inp.value = '';
  print(`<span class="ps">harry@github:<b>~</b>$</span> ${esc(line)}`);
  if (!line) return;
  hist.push(line); hi = hist.length;
  const [c, ...rest] = line.split(/\s+/), arg = rest.join(' ');
  const r = cmds[c.toLowerCase()]?.(arg);
  if (c.toLowerCase() in cmds) { if (r) print(r); }
  else print(`<span class="err">zsh: command not found: ${esc(c)}</span> — try <span class="acc">help</span>`);
}

// quick-command chips (useful on phones)
const chips = document.querySelector('.chips');
['help','whoami','stack','contact','play','stop','piano','clear'].forEach(c => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = c;
  b.onclick = e => { e.stopPropagation(); run(c); inp.focus(); }; chips.append(b);
});

// ---------- music: Web Audio synth, no files needed ----------
let ac, master, analyser, timer, step = 0, nextT = 0, piano = false;
const mtof = m => 440 * 2 ** ((m - 69) / 12);
const prog = [[57,60,64],[53,57,60],[48,52,55],[55,59,62]]; // Am F C G
const BPM = 92, STEP = 60 / BPM / 4;
function audio() {
  if (!ac) {
    ac = new AudioContext(); master = ac.createGain(); master.gain.value = .6;
    analyser = ac.createAnalyser(); analyser.fftSize = 64;
    master.connect(analyser).connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * .05, ac.sampleRate);
    noise.getChannelData(0).forEach((_, i, d) => d[i] = Math.random() * 2 - 1);
  }
  ac.resume(); return ac;
}
let noise;
function tone(f, t, d, type, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d + .02);
}
function hat(t, vol) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noise; f.type = 'highpass'; f.frequency.value = 7000; g.gain.value = vol;
  s.connect(f).connect(g).connect(master); s.start(t);
}
function schedule() {
  while (nextT < ac.currentTime + .12) {
    const ch = prog[(step >> 4) % 4], i = step % 16;
    tone(mtof(ch[[0,1,2,1][i % 4]] + 12), nextT, .25, 'triangle', .12);       // arpeggio
    if (i % 8 === 0) tone(mtof(ch[0] - 12), nextT, STEP * 7, 'sine', .35);     // bass
    if (i % 2 === 0) hat(nextT, i % 4 ? .04 : .08);                            // hats
    if ((step >> 4) % 8 >= 4 && i % 4 === 0) tone(mtof(ch[(i/4)%3] + 24), nextT, .5, 'square', .03); // lead on 2nd half
    nextT += STEP; step++;
  }
  timer = setTimeout(schedule, 25);
}
function startMusic() { if (timer) return; audio(); nextT = ac.currentTime + .05; step = 0; schedule(); np.innerHTML = '♪ <span class="acc">harry.fm</span> — snow day loop'; }
function stopMusic() { clearTimeout(timer); timer = null; np.innerHTML = '♪ stopped — type <span class="acc">play</span>'; }

// ASCII visualizer
const bars = '▁▂▃▄▅▆▇█', viz = document.getElementById('viz'), np = document.getElementById('np');
(function draw() {
  if (analyser) { const d = new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(d);
    viz.textContent = [...d.slice(0, 16)].map(v => bars[Math.min(7, v >> 5)]).join(''); }
  requestAnimationFrame(draw);
})();

// ---------- input: history, tab-complete, piano ----------
const keymap = { a:60, w:61, s:62, e:63, d:64, f:65, t:66, g:67, y:68, h:69, u:70, j:71, k:72 };
inp.addEventListener('keydown', e => {
  if (piano) {
    if (e.key === 'Escape') { piano = false; print('🎹 piano mode off'); }
    else if (keymap[e.key] && !e.repeat) { audio(); tone(mtof(keymap[e.key]), ac.currentTime, 1.2, 'triangle', .4); }
    e.preventDefault(); return;
  }
  if (e.key === 'ArrowUp' && hi > 0) { inp.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { inp.value = hist[++hi] ?? ''; hi = Math.min(hi, hist.length); e.preventDefault(); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const [c, a] = inp.value.split(/\s+/);
    const pool = a !== undefined ? Object.keys(files).filter(f => f.startsWith(a)).map(f => `${c} ${f}`) : Object.keys(cmds).filter(k => k.startsWith(c));
    if (pool.length === 1) inp.value = pool[0] + (a === undefined ? ' ' : '');
    else if (pool.length) print(pool.join('  '), 'dim');
  } else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); cmds.clear(); }
});

// boot sequence
[`<span class="dim">Last login: ${new Date().toDateString()} on ttys001</span>`,
 `<span class="acc">
 _
| |__   __ _ _ __ _ __ _   _  ___ _ __   ___
| '_ \\ / _\` | '__| '__| | | |/ __| '_ \\ / __|
| | | | (_| | |  | |  | |_| | (__| |_) | (__
|_| |_|\\__,_|_|  |_|   \\__, |\\___| .__/ \\___|
                       |___/     |_|         </span>`,
 `Welcome! Type <span class="acc">help</span> to get started, or <span class="acc">play</span> for some music 🎶`,
].forEach((l, i) => setTimeout(() => print(l), matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : i * 250));
</script>
</body>
</html>
