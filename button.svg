<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="300" height="48" viewBox="0 0 300 48" role="img" aria-labelledby="t">
<title id="t">Open the interactive terminal</title>
<style>
text{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
<rect x=".5" y=".5" width="299" height="47" rx="8" fill="#1e1e2e" stroke="#45475a"/>
<text x="18" y="29" fill="#cdd6f4"><tspan fill="#a6e3a1">$</tspan> ./open-terminal</text>
<rect class="cur" x="185" y="16" width="9" height="17" fill="#cdd6f4" fill-opacity=".8"/>
<text x="282" y="29" text-anchor="end" fill="#89b4fa">↗</text>
</svg>
