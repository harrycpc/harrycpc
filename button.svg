<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="340" height="56" viewBox="0 0 340 56" role="img" aria-labelledby="t">
<title id="t">Open the interactive terminal</title>
<style>
text{font:600 16px ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre}
.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.7}}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.glow,.cur{animation:none}}
</style>
<defs><filter id="b" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect class="glow" x="6" y="6" width="328" height="44" rx="10" fill="none" stroke="#7CFC9a" stroke-width="3" filter="url(#b)"/>
<rect x="6" y="6" width="328" height="44" rx="10" fill="#111712" stroke="#7CFC9a" stroke-width="1.5"/>
<rect x="7" y="7" width="44" height="42" rx="9" fill="#7CFC9a"/>
<rect x="40" y="7" width="11" height="42" fill="#7CFC9a"/>
<path d="M22 19l10 9-10 9" fill="none" stroke="#0b0f0c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="66" y="34" fill="#c8f7c5"><tspan fill="#6f8f6c">$</tspan> ./open-terminal</text>
<rect class="cur" x="232" y="20" width="10" height="18" fill="#7CFC9a"/>
<text x="318" y="35" text-anchor="end" fill="#7CFC9a" style="font-size:22px">↗</text>
</svg>
